<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .hexagon-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .hexagon-border {
            width: 200px;
            height: 200px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background: conic-gradient(#3498db 0%, #e0e0e0 0%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hexagon-inner {
            width: 90%; 
            height: 90%;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background-color: #ffffff;
        
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .controls {
        text-align: center;
        margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="hexagon-container">
        <div class="hexagon-border" id="progress-border">
            <div class="hexagon-inner">
                <span id="progress-text">0%</span>
            </div>
        </div>
    </div>
    <div class="controls">
        <input type="range" id="progress-slider" min="0" max="100" value="0">
    </div>
    <script>
        const progressBorder = document.getElementById('progress-border');
        const progressText = document.getElementById('progress-text');
        const slider = document.getElementById('progress-slider');

        function updateHexagonProgress(percent) {
        // Ensure the percentage is between 0 and 100
        const boundedPercent = Math.max(0, Math.min(100, percent));
        progressBorder.style.background = `conic-gradient(#3498db 0%, #3498db ${boundedPercent}%, #e0e0e0 ${boundedPercent}%)`;
        
        // Update the text inside
        progressText.innerText = `${boundedPercent}%`;
        }
        slider.addEventListener('input', (e) => {
        updateHexagonProgress(e.target.value);
        });
        updateHexagonProgress(35);
    </script>
</body>
</html>
